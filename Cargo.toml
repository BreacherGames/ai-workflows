[package]
name = "aiw"
version = "0.1.0"
edition = "2024"
description = "Team-wide AI workflows for daily development"
license = "LicenseRef-AI-Workflows"
repository = "https://github.com/BreacherGames/ai-workflows"
readme = "README.md"
keywords = ["ai", "workflows", "cursor", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "aiw"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
include_dir = "0.7"
