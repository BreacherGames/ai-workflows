name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: aiw-x86_64-unknown-linux-gnu
          - os: macos-latest
            artifact: aiw-aarch64-apple-darwin
          - os: windows-latest
            artifact: aiw-x86_64-pc-windows-msvc
            ext: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cp target/release/aiw "${{ matrix.artifact }}"
          tar -czf "${{ matrix.artifact }}.tar.gz" "${{ matrix.artifact }}"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item target/release/aiw.exe "${{ matrix.artifact }}.exe"
          Compress-Archive -Path "${{ matrix.artifact }}.exe" -DestinationPath "${{ matrix.artifact }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten
        run: |
          mkdir -p assets
          find dist -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} assets/ \;
          ls -la assets
      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          generate_release_notes: true
